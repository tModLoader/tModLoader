name: Bug Report
description: Report a bug in the Terraria Unified software (OR vanilla)
labels: ["Type: Bug", "NEW ISSUE"]
body:
- type: markdown
  attributes:
    value: |
      > The Terraria Unified software is provided "as is", without warranty of any kind, express or implied, including but not limited to the warranties of merchantability, fitness for a particular purpose and noninfringement. In no event shall the software developers be liable for any claim, damages or other liability, whether in an action of contract, tort or otherwise, arising from, out of or in connection with the software or the use or other dealings in the software.

      Please fill out all the necessary details.
- type: markdown
  attributes:
    value: |
      ## Is there an existing issue for this?
      Please search using the search bar on the issues page to see if an issue already exists for the bug you encountered. If there is, please add to that issue instead of making a new issue. You can also react with 👍 to prioritize and issue.
- type: dropdown
  attributes:
    label: OS
    description: What OS are you on?
    multiple: false
    options:
      - Windows
      - macOS
      - Linux
  validations:
    required: true
- type: dropdown
  attributes:
    label: Platform
    description: What store did you purchase Terraria from?
    multiple: false
    options:
      - Steam
      - GOG
      - WeGame
  validations:
    required: true
- type: dropdown
  attributes:
    label: This bug affects...
    description: In order to help understand the issue, we would like to know if this is a Unified-specific bug or a vanilla bug which you would like us to fix.
    multiple: false
    options:
      - 'Vanilla and Terraria Unified'
      - 'Only Terraria Unified'
  validations:
    required: true        
- type: textarea
  attributes:
    label: Description
    id: description
    description: |
      Describe your issue(s) here. What is the issue?
      Please keep this as concise as possible, preferably a single line describing the issue. 
      For example: "When I press X button in menu Y, the component Z becomes unclickable"
- type: textarea
  attributes:
    label: Log File
    description: |
      Please attach the log files here. You'll find the log files in the logs folder. Look for the `client.log`. If the issue relates to multiplayer post the `server.log` file as well.
      
      Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
- type: textarea
  attributes:
    label: Steps to reproduce
    description: Please describe the steps to reproduce this issue.
    placeholder: |
      1. [First Step]
      2. [Second Step]
      3. [And so on...]
- type: textarea
  attributes:
    label: Expected Behavior
    description: |
      What should be happening? If you don't know, leave what you think should happen.
- type: textarea
  attributes:
    label: Actual Behavior
    description: |
      What is actually happening?
- type: textarea
  attributes:
    label: Reproduction frequency
    description: |
      How often are you reliably able to reproduce this issue?
- type: textarea
  attributes:
    label: Additional Information
    description: |
       Any additional information, configuration, or data that might be necessary to reproduce the issue.
